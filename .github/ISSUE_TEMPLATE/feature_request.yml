name: Feature request
description: Suggest a user-facing improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user journey, not only the proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pairing / connection
        - Conversation
        - Approvals / questions
        - Voice
        - Files / images
        - Sessions / projects
        - Plugins / schedules
        - UI / accessibility
        - Documentation
        - Other
