name: Android journey check

on:
  pull_request:
    paths:
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'package*.json'
      - 'assets/**'
      - 'src/**'
      - 'plugins/**'
      - '.maestro/**'
      - 'scripts/ci/**'
      - 'docs/tools/fake-gateway.mjs'
      - '.github/workflows/android-*.yml'
  workflow_dispatch:
    inputs:
      abi:
        description: Test APK ABI (arm64-v8a is for real devices)
        type: choice
        options:
          - x86_64
          - arm64-v8a
        default: x86_64

permissions:
  contents: read

concurrency:
  group: android-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: source
        name: Record tested commit
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: package-lock.json
      - run: npm ci
      # A manually dispatched arm64-v8a build is installed on a real device next
      # to the release-signed app. The development signing certificate differs,
      # so a distinct package name avoids INSTALL_FAILED_UPDATE_INCOMPATIBLE and
      # never wipes the saved pairing of the installed release build.
      - name: Use a side-by-side package name for real-device builds
        if: ${{ inputs.abi == 'arm64-v8a' }}
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.android.package='app.dshmobile.client.ci';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
      - run: npx expo prebuild --platform android --no-install
      - name: Build self-contained test APK
        working-directory: android
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: >-
          ./gradlew app:assembleRelease --no-daemon --max-workers=2
          -PreactNativeArchitectures=${{ inputs.abi || 'x86_64' }}
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"
      # PR checks build only the emulator ABI. A manual dispatch can build
      # arm64-v8a for adb testing on a real device. Official release builds
      # still include every ABI.
      # Generated development signing only. Official release credentials are never used in PR jobs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-check-${{ github.run_id }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  journey:
    needs: build
    # The x86_64 emulator cannot run an arm64-v8a build; that artifact is for
    # real devices and is verified with adb instead.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.abi != 'arm64-v8a' }}
    uses: ./.github/workflows/android-journey.yml
    with:
      source_ref: ${{ needs.build.outputs.source_sha }}
      artifact_name: android-check-${{ github.run_id }}
