name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit to check for a release
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run test:node
      - run: bash scripts/__tests__/sign-android-release.test.sh
      - run: npm run typecheck
      - run: npm run lint
      - run: npx --yes expo-doctor@1.21.6
